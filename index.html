<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The smart walking stick — Live Geolocation</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-base: #080c14;
      --bg-panel: rgba(13, 20, 34, 0.88);
      --bg-card: rgba(22, 33, 54, 0.75);
      --border-line: rgba(255, 255, 255, 0.1);
      --text-white: #ffffff;
      --text-sub: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --ok: #10b981;
      --warning: #f59e0b;
      --alert: #ef4444;
      --font-ui: 'Inter', -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-white);
      font-family: var(--font-ui);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Emergency Alert Header Banner */
    #alertBanner {
      display: none;
      background: linear-gradient(90deg, #b91c1c, #ef4444);
      color: #ffffff;
      text-align: center;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 1000;
      animation: alertFlash 1s infinite alternate;
    }
    @keyframes alertFlash {
      from { opacity: 1; }
      to { opacity: 0.75; }
    }

    /* Top Command Bar */
    header {
      z-index: 500;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-line);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand-pulse {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
      transition: all 0.3s ease;
    }
    .brand-pulse.active-alert {
      background: var(--alert);
      box-shadow: 0 0 14px var(--alert);
      animation: alertFlash 0.5s infinite alternate;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-text span {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .dock-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(8, 12, 20, 0.7);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 4px 6px 4px 10px;
    }
    .dock-box label {
      font-size: 0.7rem;
      font-family: var(--font-code);
      color: var(--text-sub);
    }
    .dock-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: var(--font-code);
      font-size: 0.85rem;
      font-weight: 600;
      width: 90px;
      outline: none;
      text-transform: uppercase;
    }
    .dock-box button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* Telemetry HUD Cards */
    .hud-grid {
      z-index: 400;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-line);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      padding: 10px 20px;
    }

    .hud-card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .hud-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .hud-stat {
      font-size: 1.15rem;
      font-family: var(--font-code);
      font-weight: 700;
      color: #fff;
    }

    .stat-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .stat-fill {
      height: 100%;
      background: var(--ok);
      width: 80%;
      transition: width 0.4s ease;
    }

    /* Satellite Viewport */
    #map-viewport {
      flex: 1;
      width: 100%;
      z-index: 10;
    }

    /* High-Visibility Satellite Beacon */
    .pin-pulse {
      width: 20px;
      height: 20px;
      background: #3b82f6;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px #3b82f6;
      position: relative;
    }
    .pin-pulse::after {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #60a5fa;
      animation: wave 1.8s infinite ease-out;
    }
    @keyframes wave {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* Bottom Status Bar */
    footer {
      z-index: 500;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-line);
      padding: 8px 20px;
      font-family: var(--font-code);
      font-size: 0.72rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .live-chip {
      color: var(--ok);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      header { flex-direction: column; align-items: stretch; padding: 10px 14px; }
      .dock-box { justify-content: space-between; }
      .hud-grid { grid-template-columns: repeat(2, 1fr); padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <div id="alertBanner">EMERGENCY: FALL DETECTED OR SOS TRIGGERED</div>

  <header>
    <div class="brand-wrap">
      <div class="brand-pulse" id="statusDot"></div>
      <div class="brand-text">
        <h1>The smart walking stick</h1>
        <span>Live Satellite Grid</span>
      </div>
    </div>

    <div class="dock-box">
      <label for="stickId">DEVICE</label>
      <input type="text" id="stickId" value="STICK_01" spellcheck="false" />
      <button onclick="startSync()">Connect</button>
    </div>
  </header>

  <section class="hud-grid">
    <div class="hud-card">
      <div class="hud-meta"><span>Status</span><span>Kinetic</span></div>
      <div class="hud-stat" id="statSafety" style="color: var(--ok);">Normal</div>
      <div class="stat-bar"><div class="stat-fill" id="barSafety" style="width: 100%;"></div></div>
    </div>

    <div class="hud-card">
      <div class="hud-meta"><span>Battery</span><span>3.7V</span></div>
      <div class="hud-stat"><span id="statBattery">--</span><span style="font-size: 0.75rem; color: var(--text-sub);"> %</span></div>
      <div class="stat-bar"><div class="stat-fill" id="barBattery" style="width: 0%;"></div></div>
    </div>

    <div class="hud-card">
      <div class="hud-meta"><span>Obstacle</span><span>Sonar</span></div>
      <div class="hud-stat" id="statObstacle">Clear</div>
      <div class="stat-bar"><div class="stat-fill" id="barObstacle" style="width: 100%;"></div></div>
    </div>

    <div class="hud-card">
      <div class="hud-meta"><span>Puddle</span><span>Sensor</span></div>
      <div class="hud-stat" id="statPuddle">Dry</div>
      <div class="stat-bar"><div class="stat-fill" id="barPuddle" style="width: 20%;"></div></div>
    </div>

    <div class="hud-card">
      <div class="hud-meta"><span>Telemetry</span><span>SIM800L</span></div>
      <div class="hud-stat" id="statSync" style="font-size: 0.95rem;">--:--:--</div>
      <div class="stat-bar"><div class="stat-fill" style="width: 100%; background: var(--accent);"></div></div>
    </div>
  </section>

  <div id="map-viewport"></div>

  <footer>
    <span class="live-chip">&#x25CF; Satellite Stream Active</span>
    <span>POSITION: <strong id="coordText" style="color: #fff;">Acquiring GPS fix...</strong></span>
    <span>Google Hybrid Satellite &bull; High Precision</span>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ------------------------------------------------------------------
    // 1. FIREBASE CONFIGURATION
    // ------------------------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://YOUR-PROJECT-ID-default-rtdb.firebaseio.com"
    };

    let db = null;
    try {
      if (!firebaseConfig.databaseURL.includes("YOUR-PROJECT-ID")) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch (e) {
      console.warn("Using simulation mode until Firebase URL is provided.");
    }

    // ------------------------------------------------------------------
    // 2. REALISTIC GOOGLE HYBRID SATELLITE MAP
    // ------------------------------------------------------------------
    let currentLat = 28.6139;
    let currentLng = 77.2090;

    const map = L.map('map-viewport', {
      zoomControl: false,
      attributionControl: false
    }).setView([currentLat, currentLng], 17);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Google Satellite + Street Labels layer
    L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }).addTo(map);

    const beaconIcon = L.divIcon({
      className: '',
      html: '<div class="pin-pulse"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    const marker = L.marker([currentLat, currentLng], { icon: beaconIcon }).addTo(map)
      .bindPopup("<b>The smart walking stick</b><br>Signal Locked")
      .openPopup();

    let activeRef = null;

    // ------------------------------------------------------------------
    // 3. TELEMETRY & DATA DISPATCH
    // ------------------------------------------------------------------
    function startSync() {
      const id = document.getElementById('stickId').value.trim().toUpperCase();
      if (!id) return;

      if (activeRef && db) activeRef.off();

      if (db && !firebaseConfig.databaseURL.includes("YOUR-PROJECT-ID")) {
        activeRef = db.ref('sticks/' + id);
        activeRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) updateHUD(val);
        });
      } else {
        runSimulator();
      }
    }

    function updateHUD(data) {
      // Update GPS coordinates
      if (data.lat && data.lng) {
        currentLat = data.lat;
        currentLng = data.lng;
        marker.setLatLng([currentLat, currentLng]);
        map.panTo([currentLat, currentLng], { animate: true, duration: 1.0 });
        document.getElementById('coordText').textContent = `${data.lat.toFixed(6)}° N, ${data.lng.toFixed(6)}° E`;
      }

      // Battery
      const battery = data.battery !== undefined ? data.battery : 0;
      document.getElementById('statBattery').textContent = battery;
      const barBattery = document.getElementById('barBattery');
      barBattery.style.width = `${battery}%`;
      barBattery.style.background = battery > 40 ? 'var(--ok)' : (battery > 15 ? 'var(--warning)' : 'var(--alert)');

      // Obstacle Range
      const statObstacle = document.getElementById('statObstacle');
      const barObstacle = document.getElementById('barObstacle');
      if (data.obstacle && data.obstacle < 150) {
        statObstacle.textContent = `${data.obstacle} cm`;
        statObstacle.style.color = data.obstacle < 50 ? 'var(--alert)' : 'var(--warning)';
        barObstacle.style.width = `${Math.min(100, (data.obstacle / 200) * 100)}%`;
        barObstacle.style.background = statObstacle.style.color;
      } else {
        statObstacle.textContent = 'Clear';
        statObstacle.style.color = '#fff';
        barObstacle.style.width = '100%';
        barObstacle.style.background = 'var(--ok)';
      }

      // Puddle / Surface
      const statPuddle = document.getElementById('statPuddle');
      const barPuddle = document.getElementById('barPuddle');
      if (data.puddle === true) {
        statPuddle.textContent = 'Water!';
        statPuddle.style.color = '#38bdf8';
        barPuddle.style.width = '100%';
        barPuddle.style.background = '#38bdf8';
      } else {
        statPuddle.textContent = 'Dry';
        statPuddle.style.color = '#fff';
        barPuddle.style.width = '20%';
        barPuddle.style.background = 'var(--ok)';
      }

      // Fall / SOS Alert State
      const banner = document.getElementById('alertBanner');
      const statSafety = document.getElementById('statSafety');
      const barSafety = document.getElementById('barSafety');
      const dot = document.getElementById('statusDot');

      if (data.emergency === true) {
        banner.style.display = 'block';
        statSafety.textContent = 'INCIDENT';
        statSafety.style.color = 'var(--alert)';
        barSafety.style.width = '100%';
        barSafety.style.background = 'var(--alert)';
        dot.classList.add('active-alert');
        marker.setPopupContent(`<b style="color: #ef4444;">EMERGENCY!</b><br>${data.reason || 'Assistance requested'}`).openPopup();
      } else {
        banner.style.display = 'none';
        statSafety.textContent = 'Normal';
        statSafety.style.color = 'var(--ok)';
        barSafety.style.width = '100%';
        barSafety.style.background = 'var(--ok)';
        dot.classList.remove('active-alert');
        marker.setPopupContent(`<b>The smart walking stick</b><br>ID: ${document.getElementById('stickId').value}`);
      }

      document.getElementById('statSync').textContent = new Date().toLocaleTimeString();
    }

    // Auto-demo if Firebase is not linked yet
    function runSimulator() {
      const sample = {
        lat: currentLat + (Math.random() - 0.5) * 0.0005,
        lng: currentLng + (Math.random() - 0.5) * 0.0005,
        battery: 92,
        obstacle: 140,
        puddle: false,
        emergency: false
      };
      updateHUD(sample);
    }

    startSync();
  </script>
</body>
</html>
